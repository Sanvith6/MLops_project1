<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vehicle Insurance Prediction</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    /* Minimal styling inside template (fallback if style.css not loaded) */
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fafb;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 2rem auto;
      padding: 2rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #2563eb;
    }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 2rem;
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
      display: block;
    }
    input {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      grid-column: span 2;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    button[type="submit"] {
      background-color: #2563eb;
      color: #fff;
    }
    button[type="submit"]:hover {
      background-color: #1e40af;
    }
    .train-button {
      background-color: #059669;
      color: #fff;
      margin-top: -0.5rem;
    }
    .train-button:hover {
      background-color: #047857;
    }
    .result {
      margin-top: 1.5rem;
      text-align: center;
      padding: 1rem;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
    }
    .result h2 {
      color: #0c4a6e;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚗 Vehicle Insurance Prediction</h1>

    <!-- Prediction Form -->
    <form method="post" action="/">
      <div>
        <label for="Gender">Gender</label>
        <input type="number" id="Gender" name="Gender" placeholder="1 = Male, 0 = Female" min="0" max="1" required>
      </div>

      <div>
        <label for="Age">Age</label>
        <input type="number" id="Age" name="Age" placeholder="Enter age" required>
      </div>

      <div>
        <label for="Driving_License">Driving License</label>
        <input type="number" id="Driving_License" name="Driving_License" placeholder="1 = Yes, 0 = No" min="0" max="1" required>
      </div>

      <div>
        <label for="Region_Code">Region Code</label>
        <input type="number" step="0.01" id="Region_Code" name="Region_Code" placeholder="e.g. 28.0" required>
      </div>

      <div>
        <label for="Previously_Insured">Previously Insured</label>
        <input type="number" id="Previously_Insured" name="Previously_Insured" placeholder="1 = Yes, 0 = No" min="0" max="1" required>
      </div>

      <div>
        <label for="Annual_Premium">Annual Premium</label>
        <input type="number" step="0.01" id="Annual_Premium" name="Annual_Premium" placeholder="e.g. 35000" required>
      </div>

      <div>
        <label for="Policy_Sales_Channel">Policy Sales Channel</label>
        <input type="number" step="0.01" id="Policy_Sales_Channel" name="Policy_Sales_Channel" placeholder="e.g. 26.0" required>
      </div>

      <div>
        <label for="Vintage">Vintage</label>
        <input type="number" id="Vintage" name="Vintage" placeholder="Days since customer joined" required>
      </div>

      <div>
        <label for="Vehicle_Age_lt_1_Year">Vehicle Age &lt; 1 Year</label>
        <input type="number" id="Vehicle_Age_lt_1_Year" name="Vehicle_Age_lt_1_Year" placeholder="1 = Yes, 0 = No" min="0" max="1" required>
      </div>

      <div>
        <label for="Vehicle_Age_gt_2_Years">Vehicle Age &gt; 2 Years</label>
        <input type="number" id="Vehicle_Age_gt_2_Years" name="Vehicle_Age_gt_2_Years" placeholder="1 = Yes, 0 = No" min="0" max="1" required>
      </div>

      <div>
        <label for="Vehicle_Damage_Yes">Vehicle Damage</label>
        <input type="number" id="Vehicle_Damage_Yes" name="Vehicle_Damage_Yes" placeholder="1 = Yes, 0 = No" min="0" max="1" required>
      </div>

      <button type="submit">🔮 Predict</button>
    </form>

    <!-- Train Model Button -->
    <form method="get" action="/train">
      <button type="submit" class="train-button">⚙️ Train Model</button>
    </form>

    <!-- Result Section -->
    {% if context %}
    <div class="result">
      <h2>Result: {{ context }}</h2>
    </div>
    {% endif %}
  </div>
</body>
</html>
